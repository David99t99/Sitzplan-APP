<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: damit wir die "sicheren Bereiche" (Notch, Home-Balken) per CSS berücksichtigen können -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sitzplan</title>

  <!-- PWA: Manifest + Farben -->
  <link rel="manifest" href="./manifest.webmanifest">
  <!-- Farbe der Statusleiste = Farbe der Kopfleiste (hell / dunkel, siehe --flaeche in app.css) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1d23">

  <!-- iPhone: Homescreen-App ohne Safari-Leisten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sitzplan">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <!-- Oben: Klassen-Tabs -->
  <header id="kopf"></header>

  <!-- Mitte: die jeweilige Ansicht (Plan, SuS, Raum, Klasse) -->
  <main id="inhalt"></main>

  <!-- Unten: Navigation (gut mit dem Daumen erreichbar) -->
  <nav id="navi"></nav>

  <!-- Kleine Meldungen ("Gespeichert" usw.) -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- type="module": wir benutzen import/export, ganz ohne Build-Werkzeug -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
